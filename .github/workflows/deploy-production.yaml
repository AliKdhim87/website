name: Deployment Ali-DEV
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  vercel:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}
      url: ${{ steps.vercel-deploy.outputs.url }}
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Install pnpm
        id: pnpm-install
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # 6.1.0
        with:
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # 7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create env file
        env:
          SANITY_STUDIO_READ_TOKEN: ${{ secrets.SANITY_STUDIO_READ_TOKEN }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_GRAPHQL_API_VERSION: ${{ secrets.SANITY_GRAPHQL_API_VERSION }}
          SANITY_GROQ_API_VERSION: ${{ secrets.SANITY_GROQ_API_VERSION }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: node .github/scripts/create-env.ts

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # - name: Install Playwright
      #   run: cd apps/website && npx playwright install --with-deps
      # - name: Run Playwright tests
      #   run: pnpm playwright
      # - uses: actions/upload-artifact@v4.6.2
      #   if: always()
      #   with:
      #     name: playwright-report
      #     path: playwright-report/
      #     retention-days: 30

      - name: Build
        run: pnpm build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel
        id: vercel-deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node .github/scripts/deploy-vercel.ts

      - name: Comment Preview URL on PR
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.vercel-deploy.outputs.url }}
        run: node .github/scripts/comment-pr.ts

